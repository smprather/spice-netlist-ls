[project]
name = "spice-netlist-ls"
version = "0.4.0"
description = "Python wrapper exposing the Rust spicefmt formatter and SPICE netlist language server"
readme = "README.md"
authors = [{ name = "Myles Prather", email = "smprather@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["rich-click>=1.9.4"]

[project.scripts]
spicefmt = "spice_netlist_ls.cli:spicefmt"
spice-netlist-ls = "spice_netlist_ls.cli:lsp"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "spice_netlist_ls.build_backend"
backend-path = ["src"]

[dependency-groups]
dev = [
  "pdfplumber>=0.11.10",
  "pymupdf>=1.28.2",
  "pypdf>=6.16.1",
  "pytest>=9.1.1",
]
