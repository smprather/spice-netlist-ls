[project]
name = "spice-netlist-ls"
version = "0.2.0"
description = "Python wrapper exposing the Rust spicefmt formatter and SPICE netlist language server"
readme = "README.md"
authors = [{ name = "Myles Prather", email = "smprather@gmail.com" }]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
spicefmt = "spice_netlist_ls:spicefmt"
spice-netlist-ls = "spice_netlist_ls:lsp"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "build_backend"
backend-path = ["_pypi"]

[dependency-groups]
dev = [
  "pdfplumber>=0.11.10",
  "pymupdf>=1.28.2",
  "pypdf>=6.16.1",
  "pytest>=9.1.1",
]
