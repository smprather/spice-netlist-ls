[package]
name = "spice-netlist-ls"
version = "0.1.0"
edition = "2024"
description = "Highly opinionated SPICE formatter and language server — HSPICE golden reference, dialect-extensible"
license = "MIT"

[[bin]]
name = "spicefmt"
path = "src/main.rs"

[[bin]]
name = "spice-netlist-ls"
path = "src/bin/ls.rs"

[lib]
name = "spice_netlist_ls"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
lsp-types = "0.97"
lsp-server = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
insta = "1.38"
tempfile = "3"

[features]
default = []
