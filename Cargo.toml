[package]
name = "spice-netlist-ls"
version = "0.5.1"
edition = "2024"
description = "Highly opinionated SPICE formatter and language server — HSPICE golden reference, dialect-extensible"
license = "MIT"
repository = "https://github.com/smprather/spice-netlist-ls"
homepage = "https://github.com/smprather/spice-netlist-ls"
documentation = "https://github.com/smprather/spice-netlist-ls"
keywords = ["spice", "hspice", "netlist", "formatter", "linter", "lsp", "spectre", "ngspice", "ltspice"]
categories = ["command-line-utilities", "parser-implementations"]

[[bin]]
name = "spicefmt"
path = "src/main.rs"

[[bin]]
name = "spice-netlist-ls"
path = "src/bin/ls.rs"

[lib]
name = "spice_netlist_ls"
path = "src/lib.rs"

# cargo-dist metadata: pre-built, statically linked where feasible, with
# an installer script as a convenience and plain tarballs + sha256sums so
# air-gapped mirrors can just rsync the releases page.
[profile.dist]
inherits = "release"
lto = true

[workspace.metadata.dist]
# Hand-maintained: this block plus .github/workflows/release.yml are written
# for our needs (plain tarballs first-class, air-gap-friendly) rather than
# whatever `dist init` last generated, so tell dist not to fight us.
allow-dirty = ["ci"]
cargo-dist-version = "0.28.0"
ci = ["github"]
installers = ["shell", "powershell"]
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
dist-url = "https://github.com/smprather/spice-netlist-ls"
tap = "smprather/homebrew-spicefmt"
bin-aliases = { spicefmt = [], spice-netlist-ls = [] }

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
lsp-types = "0.97"
lsp-server = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.8"
directories = "6"
globset = "0.4"

[dev-dependencies]
insta = { version = "1.38", features = ["toml"] }
tempfile = "3"
# Used only by examples/perf_probe.rs to transparently decompress the committed
# bzip2-compressed perf deck. A dev-dependency so it never lands in the shipped
# musl binaries.
bzip2 = "0.5"

[build-dependencies]
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.3"

[features]
default = []
