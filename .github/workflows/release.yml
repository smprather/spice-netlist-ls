# Release workflow for cargo-dist.
#
# Trigger by pushing a `vX.Y.Z` tag. cargo-dist builds per-target binaries
# (statically linked on linux-*-musl, so the same artifact works on glibc
# distros), creates a GitHub Release with:
#   * plain .tar.gz / .zip per platform — first-class, rsync-friendly
#   * install script (shell / powershell) for convenience
#   * sha256sums for integrity verification without trusting the network
#   * the man page (`spicefmt.1`) from build.rs inside each tarball
#
# Air-gapped mirrors: `reposync` or a cron'd `gh release download -p '*.tar.gz'`
# against this workflow's output yields a working internal repository.

name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.plan.outputs.val }}
      tag: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.tag || github.ref_name }}
      tag-flag: ${{ !startsWith(github.ref, 'refs/tags/') && format('--tag={0}', inputs.tag) || '' }}
      publishing: ${{ startsWith(github.ref, 'refs/tags/') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.28.0/cargo-dist-installer.sh | sh
      # In dist >= 0.25, creating the GitHub Release is an explicit host
      # step (`--steps=create`) run from the plan job; a bare `dist plan`
      # would never publish anything.
      - id: plan
        env:
          TAG: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.tag || github.ref_name }}
        run: |
          cargo dist host --steps=create --tag="$TAG" --output-format=json > dist-manifest.json
          {
            echo 'val<<DIST_MANIFEST_EOF'
            cat dist-manifest.json
            echo 'DIST_MANIFEST_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json

  build-local-artifacts:
    name: Build (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.val != 'null'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-latest }
          - { target: x86_64-apple-darwin, runner: macos-14 }
          - { target: aarch64-apple-darwin, runner: macos-14 }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: artifacts-dist-manifest
      - name: Install dist
        if: runner.os != 'Windows'
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.28.0/cargo-dist-installer.sh | sh
      - name: Install dist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-RestMethod https://github.com/axodotdev/cargo-dist/releases/download/v0.28.0/cargo-dist-installer.ps1 | Invoke-Expression
      - name: Install cross tools (aarch64-musl on x64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          pip3 install ziglang
          cargo install --locked cargo-zigbuild
      - name: dist build
        run: cargo dist build --target=${{ matrix.target }} --artifacts=local --output-format=json
      - name: Upload local artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: target/distrib/*
          if-no-files-found: error

  host:
    needs: [plan, build-local-artifacts]
    # dist >= 0.25's host steps (create/upload/release) only manage axodotdev
    # hosting; for plain GitHub Releases the generated workflow creates the
    # release itself via `gh release create`. We do the same.
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Drop granular manifests and unpacked dirs
        run: |
          rm -f artifacts/*-dist-manifest.json artifacts/dist-manifest.json
          # cargo-dist writes both the .tar.xz/.zip archives AND an unpacked
          # <target>/ directory per target; `gh release create` can't upload
          # directories, so keep only the archives and their checksums.
          rm -rf artifacts/spice-netlist-ls-*/
      - name: Create GitHub Release
        env:
          TAG: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.tag || github.ref_name }}
          PRERELEASE_FLAG: "${{ fromJson(needs.plan.outputs.val).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(needs.plan.outputs.val).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(needs.plan.outputs.val).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write/read notes via file to avoid quoting issues
          echo "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"
          # --- changelog: always append change list ---
          {
            echo ""
            echo "## What's Changed"
            echo ""
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n1 || true)
            if [ -z "$PREV_TAG" ]; then
              PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -n1 || true)
            fi
            if [ -n "$PREV_TAG" ]; then
              echo "_Changes since ${PREV_TAG}:_"
              echo ""
              if git log "${PREV_TAG}..HEAD" --oneline --no-merges | grep -q .; then
                git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges >> "$RUNNER_TEMP/notes.txt" || true
                echo "" >> "$RUNNER_TEMP/notes.txt"
                BODIES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%b" | grep -E "^[[:space:]]*-[[:space:]]" || true)
                if [ -n "$BODIES" ]; then
                  echo "" >> "$RUNNER_TEMP/notes.txt"
                  echo "$BODIES" >> "$RUNNER_TEMP/notes.txt"
                fi
              else
                echo "- No commits found between ${PREV_TAG} and ${TAG}" >> "$RUNNER_TEMP/notes.txt"
              fi
              echo "" >> "$RUNNER_TEMP/notes.txt"
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}" >> "$RUNNER_TEMP/notes.txt"
            else
              echo "_Initial release ${TAG}_" >> "$RUNNER_TEMP/notes.txt"
              echo "" >> "$RUNNER_TEMP/notes.txt"
              git log -1 --pretty=format:"- %s (%h)" >> "$RUNNER_TEMP/notes.txt" || true
            fi
          } >> "$RUNNER_TEMP/notes.txt"
          gh release create "$TAG" \
            --target "$RELEASE_COMMIT" \
            $PRERELEASE_FLAG \
            --title "$ANNOUNCEMENT_TITLE" \
            --notes-file "$RUNNER_TEMP/notes.txt" \
            artifacts/*
